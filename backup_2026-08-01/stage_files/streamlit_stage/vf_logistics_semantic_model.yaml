name: VF_LOGISTICS_SEMANTIC_MODEL
description: "Semantic model for VF Logistics seaport Bill of Lading management system"

tables:
  - name: BILL_OF_LADING
    base_table:
      database: MENDIX_APP
      schema: AGENTS
      table: BILL_OF_LADING
    description: "Main shipment records - Bill of Lading documents for maritime logistics"
    dimensions:
      - name: BL_NUMBER
        expr: BL_NUMBER
        description: "Unique Bill of Lading number (e.g., MAEU01234)"
        data_type: VARCHAR
      - name: CARRIER_NAME
        expr: CARRIER_NAME
        description: "Shipping carrier/line (MAERSK, MSC, COSCO, EVERGREEN, ONE, OOCL, HAPAG_LLOYD, YANG_MING, ZIM, HMM)"
        data_type: VARCHAR
      - name: VESSEL_NAME
        expr: VESSEL_NAME
        description: "Name of the vessel/ship"
        data_type: VARCHAR
      - name: PORT_OF_LOADING
        expr: PORT_OF_LOADING_LOCODE
        description: "Origin port UN/LOCODE (VNSGN, VNHPH, SGSIN, CNSHA, JPYOK, KRPUS)"
        data_type: VARCHAR
      - name: PORT_OF_DISCHARGE
        expr: PORT_OF_DISCHARGE_LOCODE
        description: "Destination port UN/LOCODE"
        data_type: VARCHAR
      - name: STATUS
        expr: STATUS
        description: "Shipment status: Draft, Pending_Review, APPROVED, In_Transit, Delivered, Cancelled"
        data_type: VARCHAR
      - name: PAYMENT_STATUS
        expr: PAYMENT_STATUS
        description: "Payment status: Pending, Paid, Overdue"
        data_type: VARCHAR
      - name: COMMODITY_DESCRIPTION
        expr: COMMODITY_DESCRIPTION
        description: "Description of shipped goods"
        data_type: VARCHAR
      - name: HS_CODE
        expr: HS_CODE
        description: "Harmonized System code for customs classification"
        data_type: VARCHAR
      - name: CONTAINER_NUMBER
        expr: CONTAINER_NUMBER
        description: "Container ID (e.g., MSKU1234567)"
        data_type: VARCHAR
      - name: CONTAINER_SIZE
        expr: CONTAINER_SIZE
        description: "Container size: 20GP, 40GP, 40HC, 45HC"
        data_type: VARCHAR
      - name: SHIPPER_NAME
        expr: SHIPPER_NAME
        description: "Company shipping the goods (sender)"
        data_type: VARCHAR
      - name: CONSIGNEE_NAME
        expr: CONSIGNEE_NAME
        description: "Company receiving the goods (receiver)"
        data_type: VARCHAR
      - name: IS_DANGEROUS_GOODS
        expr: IS_DANGEROUS_GOODS
        description: "Whether cargo contains dangerous goods (TRUE/FALSE)"
        data_type: BOOLEAN
      - name: FREIGHT_TERMS
        expr: FREIGHT_TERMS
        description: "Freight payment terms: Prepaid, Collect"
        data_type: VARCHAR
      - name: SYNCED_TO_ERP
        expr: SYNCED_TO_ERP
        description: "Whether synced to SAP ERP system (TRUE/FALSE)"
        data_type: BOOLEAN
      - name: BL_DATE
        expr: BL_DATE
        description: "Date the Bill of Lading was issued"
        data_type: DATE
      - name: ETD
        expr: ETD
        description: "Estimated Time of Departure"
        data_type: DATE
      - name: ETA
        expr: ETA
        description: "Estimated Time of Arrival"
        data_type: DATE
      - name: CREATED_AT
        expr: CREATED_AT
        description: "Record creation timestamp"
        data_type: TIMESTAMP_NTZ
    measures:
      - name: TOTAL_CHARGES
        expr: TOTAL_CHARGES
        description: "Total freight charges in USD"
        data_type: NUMBER
      - name: GROSS_WEIGHT_KGS
        expr: GROSS_WEIGHT_KGS
        description: "Total gross weight in kilograms"
        data_type: NUMBER
      - name: SHIPMENT_COUNT
        expr: "COUNT(*)"
        description: "Number of shipments"
        data_type: NUMBER
      - name: TOTAL_REVENUE
        expr: "SUM(TOTAL_CHARGES)"
        description: "Total revenue from freight charges in USD"
        data_type: NUMBER
      - name: AVG_CHARGES
        expr: "AVG(TOTAL_CHARGES)"
        description: "Average freight charge per shipment in USD"
        data_type: NUMBER
      - name: TOTAL_WEIGHT
        expr: "SUM(GROSS_WEIGHT_KGS)"
        description: "Total weight of all shipments in KG"
        data_type: NUMBER
      - name: AVG_WEIGHT
        expr: "AVG(GROSS_WEIGHT_KGS)"
        description: "Average weight per shipment in KG"
        data_type: NUMBER
      - name: DG_SHIPMENT_COUNT
        expr: "SUM(CASE WHEN IS_DANGEROUS_GOODS THEN 1 ELSE 0 END)"
        description: "Number of dangerous goods shipments"
        data_type: NUMBER

  - name: FRAUD_ALERT
    base_table:
      database: MENDIX_APP
      schema: AGENTS
      table: FRAUD_ALERT
    description: "Fraud detection alerts generated by automated scanning"
    dimensions:
      - name: ALERT_TYPE
        expr: ALERT_TYPE
        description: "Type: HIGH_VALUE_ANOMALY, WEIGHT_ANOMALY, COST_PER_KG_ANOMALY, DUPLICATE_BL, ROUTE_DEVIATION"
        data_type: VARCHAR
      - name: SEVERITY
        expr: SEVERITY
        description: "Alert severity: HIGH, MEDIUM, LOW"
        data_type: VARCHAR
      - name: ALERT_STATUS
        expr: STATUS
        description: "Alert status: OPEN, INVESTIGATING, RESOLVED, DISMISSED"
        data_type: VARCHAR
      - name: DESCRIPTION
        expr: DESCRIPTION
        description: "Alert description with details"
        data_type: VARCHAR
      - name: DETECTED_AT
        expr: DETECTED_AT
        description: "When the alert was detected"
        data_type: TIMESTAMP_NTZ
    measures:
      - name: ALERT_COUNT
        expr: "COUNT(*)"
        description: "Number of fraud alerts"
        data_type: NUMBER

verified_queries:
  - question: "How many shipments are there in total?"
    sql: "SELECT COUNT(*) as TOTAL_SHIPMENTS FROM MENDIX_APP.AGENTS.BILL_OF_LADING"
  - question: "What is the total revenue?"
    sql: "SELECT SUM(TOTAL_CHARGES) as TOTAL_REVENUE FROM MENDIX_APP.AGENTS.BILL_OF_LADING"
  - question: "Top 5 carriers by shipment count"
    sql: "SELECT CARRIER_NAME, COUNT(*) as SHIPMENT_COUNT FROM MENDIX_APP.AGENTS.BILL_OF_LADING GROUP BY CARRIER_NAME ORDER BY SHIPMENT_COUNT DESC LIMIT 5"
  - question: "How many shipments are pending review?"
    sql: "SELECT COUNT(*) as PENDING_COUNT FROM MENDIX_APP.AGENTS.BILL_OF_LADING WHERE STATUS = 'Pending_Review'"
  - question: "Show high severity fraud alerts"
    sql: "SELECT ALERT_TYPE, SEVERITY, DESCRIPTION, DETECTED_AT FROM MENDIX_APP.AGENTS.FRAUD_ALERT WHERE SEVERITY = 'HIGH' ORDER BY DETECTED_AT DESC LIMIT 20"
  - question: "Average charges by port of loading"
    sql: "SELECT PORT_OF_LOADING_LOCODE, AVG(TOTAL_CHARGES) as AVG_CHARGES, COUNT(*) as SHIPMENTS FROM MENDIX_APP.AGENTS.BILL_OF_LADING GROUP BY PORT_OF_LOADING_LOCODE ORDER BY AVG_CHARGES DESC"
  - question: "Revenue by carrier"
    sql: "SELECT CARRIER_NAME, SUM(TOTAL_CHARGES) as REVENUE, COUNT(*) as SHIPMENTS FROM MENDIX_APP.AGENTS.BILL_OF_LADING GROUP BY CARRIER_NAME ORDER BY REVENUE DESC"
  - question: "Shipments with dangerous goods"
    sql: "SELECT BL_NUMBER, CARRIER_NAME, COMMODITY_DESCRIPTION, PORT_OF_LOADING_LOCODE, PORT_OF_DISCHARGE_LOCODE, TOTAL_CHARGES FROM MENDIX_APP.AGENTS.BILL_OF_LADING WHERE IS_DANGEROUS_GOODS = TRUE LIMIT 20"
